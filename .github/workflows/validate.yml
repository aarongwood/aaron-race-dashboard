name: Validate race reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and build every race report
        run: npm test
      - name: Require generated reports to match race packets
        run: git diff --exit-code -- reports
